[project]
name = "vibe-podcast"
version = "0.3.0"
description = "Humble multi-host AI tech podcast studio with zero-key Ollama/CLI LLMs, Edge-TTS dialogue, overlap mixing, Show Bible memory, and RSS feeds."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["podcast", "ai-podcast", "tts", "edge-tts", "ollama", "fastapi", "rss", "web-audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "edge-tts>=6.1.12",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/tonnychiulab/vibe-podcast"
Repository = "https://github.com/tonnychiulab/vibe-podcast"
Issues = "https://github.com/tonnychiulab/vibe-podcast/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
